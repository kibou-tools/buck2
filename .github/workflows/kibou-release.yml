name: Release Kibou Buck2 binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            executable: buck2
            archive: buck2-x86_64-unknown-linux-gnu.zst
          - os: macos-26
            triple: aarch64-apple-darwin
            executable: buck2
            archive: buck2-aarch64-apple-darwin.zst
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            executable: buck2.exe
            archive: buck2-x86_64-pc-windows-msvc.exe.zst
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup_linux_env
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup_macos_env
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup_windows_env
      - name: Test Buck2 test orchestration
        run: cargo test -p buck2_test
      - name: Build native release binary
        shell: bash
        env:
          BUCK2_RELEASE_TIMESTAMP: ${{ github.event.repository.updated_at }}
          BUCK2_SET_EXPLICIT_VERSION: kibou-${{ github.sha }}
          RUSTFLAGS: --cfg tokio_unstable -C strip=debuginfo -C codegen-units=1
        run: cargo build --release --bin buck2 --target '${{ matrix.target.triple }}'
      - name: Check, compress, and checksum
        shell: bash
        run: |
          binary='target/${{ matrix.target.triple }}/release/${{ matrix.target.executable }}'
          "$binary" --version | tee version.txt
          grep -F "$GITHUB_SHA" version.txt
          mkdir artifacts
          zstd -z "$binary" -o 'artifacts/${{ matrix.target.archive }}'
          python - 'artifacts/${{ matrix.target.archive }}' <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(archive.suffix + ".sha256").write_text(
              f"{checksum}  {archive.name}\n"
          )
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: buck2-${{ matrix.target.triple }}
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: buck2-*
          path: artifacts
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd artifacts
          sha256sum --check --ignore-missing *.sha256
          sha256sum *.zst | sort > SHA256SUMS
          tag="kibou-$(date -u +%Y-%m-%d-%H.%M.%S)"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            ./*.zst SHA256SUMS
