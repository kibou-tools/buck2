name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  # Runner labels are repository (owner) specific, so the Meta larger runners
  # (4-core-ubuntu, windows-8-core) don't exist on forks and jobs requesting
  # them would sit queued forever waiting for a runner that isn't available.
  # Fall back to the standard GitHub-hosted runners there.
  linux-build-and-test:
    runs-on: ${{ github.repository_owner == 'facebook' && '4-core-ubuntu' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_linux_env
    - uses: ./.github/actions/build_debug
    - name: Restore NativeLink smoke cache
      id: restore-native-test-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/buck2-native-test-cache/cache.tar.gz
        key: native-test-cache-v1-${{ runner.os }}-${{ hashFiles('app/buck2_test/src/orchestrator.rs', '.github/kibou/native-test-cache-smoke/**') }}-${{ github.run_id }}
        restore-keys: |
          native-test-cache-v1-${{ runner.os }}-${{ hashFiles('app/buck2_test/src/orchestrator.rs', '.github/kibou/native-test-cache-smoke/**') }}-
    - name: Smoke test local native-test cache uploads
      env:
        BUCK2: ${{ runner.temp }}/artifacts/buck2
        CACHE_ARCHIVE: ${{ runner.temp }}/buck2-native-test-cache/cache.tar.gz
        CONTAINER_RUNTIME: docker
        STATE_ROOT: ${{ runner.temp }}/buck2-native-test-cache
      run: .github/kibou/native-test-cache-smoke/run.sh
    - name: Stop NativeLink before saving its cache
      if: always()
      run: docker stop buck2-native-test-cache-smoke || true
    - name: Save NativeLink smoke cache
      if: success()
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/buck2-native-test-cache/cache.tar.gz
        key: native-test-cache-v1-${{ runner.os }}-${{ hashFiles('app/buck2_test/src/orchestrator.rs', '.github/kibou/native-test-cache-smoke/**') }}-${{ github.run_id }}
    - uses: ./.github/actions/run_test_py
  macos-build-and-test:
    # Pinned to macos-14: on the macos-15 runner image `latest-stable` selects an
    # Xcode/SDK that mis-targets the deployment SDK and breaks the `cargo build`
    # step (actions/runner-images#12758). macos-14 resolves to a known-good Xcode 16.x.
    runs-on: macos-14
    steps:
    - uses: maxim-lobanov/setup-xcode@v1.6.0
      with:
        xcode-version: latest-stable
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_macos_env
    - uses: ./.github/actions/build_debug
    - uses: ./.github/actions/run_test_py
  windows-build-and-test:
    runs-on: ${{ github.repository_owner == 'facebook' && 'windows-8-core' || 'windows-latest' }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_windows_env
    - uses: ./.github/actions/build_debug
    - uses: ./.github/actions/run_test_py
